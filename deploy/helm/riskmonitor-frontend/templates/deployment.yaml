apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "riskmonitor-frontend.fullname" . }}
  labels:
    {{- include "riskmonitor-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "riskmonitor-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "riskmonitor-frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RISKMONITOR_API_UPSTREAM
              value: {{ .Values.api.upstream | quote }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
