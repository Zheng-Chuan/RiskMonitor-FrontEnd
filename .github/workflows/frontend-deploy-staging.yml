name: frontend-deploy-staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPOSITORY: ${{ secrets.FRONTEND_IMAGE_REPO }}
      IMAGE_TAG: ${{ github.sha }}
      KUBE_NAMESPACE: riskmonitor-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CR_REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${KUBE_CONFIG_STAGING}" > "$HOME/.kube/config"
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy to staging
        run: |
          helm upgrade --install riskmonitor-frontend deploy/helm/riskmonitor-frontend \
            -n "${KUBE_NAMESPACE}" \
            --create-namespace \
            -f deploy/helm/riskmonitor-frontend/values-staging.yaml \
            --set image.repository="${IMAGE_REPOSITORY}" \
            --set image.tag="${IMAGE_TAG}" \
            --set ingress.host="${STAGING_HOST}"
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/riskmonitor-frontend -n "${KUBE_NAMESPACE}" --timeout=180s

      - name: Smoke check
        run: curl -fsS "${STAGING_BASE_URL}/healthz"
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
